<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Portal | Blood Donor Connect</title>

    <link rel="stylesheet" href="css/auth.css">

    <style>
        .secret-icon {
            font-size: 42px;
            margin-bottom: 18px;
        }

        .code-hint {
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>

<body>

<main class="form-shell">

    <a class="back" href="index.html">
        ← Back
    </a>

    <div class="form-card">

        <div class="secret-icon">
            🔐
        </div>

        <p class="eyebrow">
            RESTRICTED ACCESS
        </p>

        <h1>
            Admin Portal
        </h1>

        <p class="muted">Sign in with your authorized administrator account.</p>

        <form id="adminLoginForm">
            <label>
                Email address
                <input id="adminEmail" type="email" autocomplete="username" placeholder="admin@example.com" required>
            </label>

            <label>
                Password
                <input id="adminPassword" type="password" autocomplete="current-password" required>
            </label>

            <p class="code-hint">Authorized administrators only.</p>

            <button class="primary-btn" type="submit">Sign in to Admin Portal</button>
            <p id="adminMessage" class="form-message" aria-live="polite"></p>
        </form>

    </div>

</main>

<script
    type="module"
    src="js/admin-auth.js"
></script>

</body>
</html>
