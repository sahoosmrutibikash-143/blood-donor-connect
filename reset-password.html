
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Blood Donor Connect</title>
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <main class="form-shell">
    <a class="back" href="index.html">← Back to login</a>

    <div class="form-card">
      <div class="mini-logo">🩸</div>
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>Reset Password</h1>
      <p class="muted">
        Enter your registered email to receive a password reset link.
      </p>

      <form id="resetRequestForm">
        <label>
          Email Address
          <input
            id="resetEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </label>

        <button class="primary-btn" type="submit">
          Send Reset Link
        </button>

        <p id="resetMessage" class="form-message"></p>
      </form>

      <form id="newPasswordForm" hidden>
        <label>
          New Password
          <input
            id="newPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </label>

        <label>
          Confirm New Password
          <input
            id="confirmNewPassword"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </label>

        <button class="primary-btn" type="submit">
          Update Password
        </button>
      </form>

      <p class="switch">
        Remembered your password?
        <a href="donor-login.html">Back to login</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
