
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login | Blood Donor Connect</title>
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <main class="form-shell">
    <a class="back" href="index.html">← Back to login</a>

    <div class="form-card">
      <div class="mini-logo">👤</div>
      <p class="eyebrow">PATIENT PORTAL</p>
      <h1>Patient Login</h1>
      <p class="muted">
        You can also sign in from the main login page.
      </p>

      <form id="loginForm">
        <label>
          Email
          <input
            id="identifier"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          >
        </label>

        <label>
          Password
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <p style="text-align:right; margin: -5px 0 15px;">
          <a href="reset-password.html"
             style="color:#ff5364; font-size:14px;">
            Forgot Password?
          </a>
        </p>

        <button class="primary-btn" type="submit">
          Sign in
        </button>

        <p id="message" class="form-message"></p>
      </form>

      <p class="switch">
        New patient?
        <a href="signup.html?role=patient">Create patient account</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
